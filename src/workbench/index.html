<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loopminder · 项目工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/workbench/assets/workbench.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="workspaceSidebar" aria-label="工作区">
      <div class="brand">
        <span class="mark" aria-hidden="true">L</span> Loopminder
        <button class="icon-button sidebar-close" id="sidebarClose" aria-label="关闭工作区菜单">×</button>
      </div>
      <button class="new" id="newProject"><span aria-hidden="true">＋</span> 新建项目</button>
      <div class="sidehead">
        <span>项目</span>
        <button class="link icon-button" id="refresh" title="刷新项目" aria-label="刷新项目">↻</button>
      </div>
      <ul class="project-list" id="projects" aria-label="项目"></ul>
      <div class="sidefoot"><button class="link" id="settingsButton"><span aria-hidden="true">⚙</span> 设置</button></div>
    </aside>
    <button class="sidebar-backdrop" id="sidebarBackdrop" aria-label="关闭工作区菜单" tabindex="-1"></button>
    <main class="main">
      <header class="header">
        <div class="title-group">
          <button class="icon-button sidebar-toggle" id="sidebarToggle" aria-expanded="false" aria-controls="workspaceSidebar" aria-label="工作区菜单">☰</button>
          <span id="title" class="headline">项目工作台</span>
        </div>
        <nav class="tabs" aria-label="工作台视图">
          <button class="tab active" data-tab="chat" aria-current="page">对话</button>
          <button class="tab" data-tab="activity">协作与轨迹</button>
        </nav>
      </header>
      <div id="banner" class="banner" role="status" hidden></div>
      <div class="body">
        <section class="view" id="activityView" hidden>
          <details id="reconcilePanel" class="collaboration hidden">
            <summary>任务与协作</summary>
            <div id="reconcileControls" class="collaboration-controls">
              <label class="task-field">任务编号 <input id="reconcileTask" placeholder="输入任务编号"></label>
              <button class="secondary" id="reconcileButton">核对待确认派工</button>
              <button class="secondary" id="usageButton">查看负责人上下文</button>
              <div id="reconcileResult" class="notice"></div>
              <div id="usageResult" class="notice"></div>
            </div>
          </details>
          <div class="empty" id="traceEmpty">选择项目后查看运行轨迹。</div>
          <iframe id="traceFrame" title="项目运行轨迹" class="hidden"></iframe>
        </section>
        <section id="chatView" class="body">
          <div class="welcome" id="welcome">
            <span class="welcome-mark" aria-hidden="true">L</span>
            <h1>项目工作台</h1>
            <p class="muted">选择一个项目，或新建项目与 PM 开始讨论。</p>
          </div>
          <div class="messages hidden" id="messages" aria-label="对话记录"></div>
          <div class="composer">
            <textarea id="message" aria-label="描述你的目标，或提出想讨论的问题" placeholder="描述你的目标，或提出想讨论的问题" disabled></textarea>
            <div class="bar">
              <button type="button" class="notice project-label" id="projectLabel" disabled>先创建或选择项目</button>
              <div class="composer-controls">
                <select id="model" aria-label="模型"><option value="">默认模型</option></select>
                <select id="effort" aria-label="思考等级"><option value="">默认思考等级</option></select>
                <button class="send" id="send" disabled aria-label="发送">↑</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <dialog class="dialog" id="projectDialog" aria-labelledby="projectHeading">
    <h2 id="projectHeading">新建项目</h2>
    <label class="field" for="directory">项目文件夹</label>
    <div class="row">
      <input id="directory" placeholder="输入绝对路径或选择文件夹" autofocus>
      <button class="secondary" id="chooseFolder">选择</button>
    </div>
    <label class="field">项目目标
      <input id="goal" placeholder="例如：帮助团队管理项目进度">
    </label>
    <p class="notice">每个项目绑定一个本机目录。请使用独立目录，避免与其他项目、宿主目录或应用数据重叠。</p>
    <div id="projectError" class="error" role="status"></div>
    <div class="actions">
      <button class="secondary" data-close="projectDialog">取消</button>
      <button class="primary" id="createProject">创建项目</button>
    </div>
  </dialog>

  <dialog class="dialog settings" id="settingsDialog" aria-labelledby="settingsHeading">
    <header class="settings-header">
      <h2 id="settingsHeading">工作台设置</h2>
      <button class="icon-button" data-close="settingsDialog" aria-label="关闭设置" title="关闭设置">×</button>
    </header>
    <div class="settings-layout">
      <nav class="settings-nav" aria-label="设置分类">
        <button class="tab active" data-settings="models" aria-pressed="true" autofocus>模型</button>
        <button class="tab" data-settings="collaboration" aria-pressed="false">协作与审查</button>
        <button class="tab" data-settings="runtime" aria-pressed="false">运行环境</button>
      </nav>
      <div id="settingsContent" class="settings-content">
        <div id="modelSettings" data-settings-panel="models">
          <section>
            <h3>模型服务</h3>
            <label class="field">选择模型服务<select id="providerSelect"><option value="">新增模型服务</option></select></label>
            <label class="field">服务编号<input id="providerId" placeholder="例如 easycli"></label>
            <label class="field">显示名称<input id="providerName" placeholder="默认使用服务编号"></label>
            <label class="field">API 地址<input id="baseUrl" placeholder="http://127.0.0.1:8317/v1"></label>
            <label class="field">API 凭据<input id="token" type="password" autocomplete="off" placeholder="留空则保留已有凭据"></label>
            <p class="notice">凭据保存在本机 .env，远程地址使用 HTTPS。</p>
            <div class="actions settings-actions">
              <button class="secondary" id="saveProvider">保存服务</button>
              <button class="secondary" id="discover">获取模型</button>
            </div>
            <div id="modelList"></div>
            <div class="actions settings-actions" id="modelActions" hidden>
              <button class="primary" id="saveModels">保存模型选择</button>
            </div>
            <div id="settingsError" class="notice" role="status"></div>
          </section>
          <section>
            <h3>默认模型</h3>
            <div class="fields-grid">
              <label class="field">默认模型<select id="defaultModel"><option value="">请选择</option></select></label>
              <label class="field">默认思考等级<select id="defaultEffort"><option value="">默认</option></select></label>
            </div>
            <button class="secondary" id="saveDefault">保存默认模型</button>
            <div id="defaultStatus" class="notice" role="status"></div>
          </section>
        </div>
        <div id="collaborationSettings" data-settings-panel="collaboration" hidden>
          <section>
            <h3>Clef 设置</h3>
            <label class="field">Cloudflare Account ID<input id="clefAccount"></label>
            <label class="field">API 令牌<input id="clefToken" type="password" autocomplete="off" placeholder="留空则保留已有凭据"></label>
            <button class="secondary" id="saveClef">保存 Clef 设置</button>
            <div id="clefStatus" class="notice" role="status"></div>
          </section>
        </div>
        <div id="runtimeSettings" data-settings-panel="runtime" hidden></div>
      </div>
    </div>
  </dialog>
  <script src="/workbench/assets/app.js"></script>
</body>
</html>
