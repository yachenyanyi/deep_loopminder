<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loopminder · 项目工作台</title><link rel="icon" href="data:,">
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#20232b;background:#fff;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}.app{display:flex;height:100vh}.sidebar{width:280px;min-width:240px;background:#f7f8fa;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;padding:18px 12px}.brand{font-size:17px;font-weight:750;display:flex;align-items:center;gap:9px;padding:4px 6px 20px}.mark{width:22px;height:22px;display:grid;place-items:center;background:#161b29;color:white;border-radius:7px;font-size:13px}.new{border:1px solid #dcdfe4;background:#fff;border-radius:8px;padding:10px;width:100%}.sidehead{color:#9299a3;margin:30px 7px 10px;display:flex;justify-content:space-between;align-items:center}.list{overflow:auto;flex:1}.project{width:100%;border:0;border-radius:7px;background:transparent;text-align:left;padding:10px;display:flex;gap:9px;align-items:center;color:#3d4654}.project.active,.project:hover{background:#e9ebee}.project span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sidefoot{border-top:1px solid #e6e8eb;padding-top:10px}.link{border:0;background:none;padding:9px;color:#5b6573;width:100%;text-align:left}.main{min-width:0;flex:1;display:flex;flex-direction:column}.header{height:70px;border-bottom:1px solid #f0f1f3;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.headline{font-weight:650}.tabs{display:flex;gap:20px}.tab{border:0;background:none;color:#7a8491;padding:10px 0}.tab.active{color:#1e293b;border-bottom:2px solid #557fea}.body{flex:1;display:flex;flex-direction:column;overflow:hidden}.welcome{margin:auto;text-align:center;color:#313b4a}.welcome h1{font-size:26px;font-weight:650;letter-spacing:-.04em}.muted{color:#8b95a3}.messages{flex:1;overflow:auto;padding:24px max(28px,calc((100% - 950px)/2))}.message{margin:18px 0;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{background:#f1f4f9;border-radius:14px;padding:12px 16px;margin-left:auto;max-width:80%;width:fit-content}.message.assistant{padding:8px 0}.composer{width:min(950px,calc(100% - 48px));margin:0 auto 28px;border:1px solid #e2e5ea;border-radius:18px;box-shadow:0 4px 16px #1623380b;padding:12px}.composer textarea{border:0;resize:none;outline:none;width:100%;min-height:54px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.bar select{border:0;background:white;color:#667282;max-width:250px}.send{background:#668de8;color:white;border:0;border-radius:50%;width:34px;height:34px;font-size:19px}.banner{padding:8px 28px;background:#fff8ec;color:#94621b}.error{color:#b42318}.overlay{position:fixed;inset:0;background:#11182760;display:grid;place-items:center}.overlay[hidden],.view[hidden],.banner[hidden]{display:none}.dialog{background:white;width:min(540px,calc(100% - 32px));border-radius:14px;padding:24px;box-shadow:0 20px 55px #0003}.dialog h2{margin:0 0 20px;font-size:19px}.field{display:block;margin:15px 0;color:#475467}.field input,.field select{display:block;width:100%;border:1px solid #d6dce4;border-radius:7px;padding:10px;margin-top:6px}.row{display:flex;gap:8px}.row input{flex:1}.row button,.secondary{border:1px solid #d9dfe6;background:#fff;border-radius:7px;padding:9px 12px}.primary{border:0;background:#386bd8;color:white;border-radius:7px;padding:10px 16px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.notice{font-size:12px;color:#798493;line-height:1.6}.settings{max-height:65vh;overflow:auto}.view{height:100%;overflow:auto}.empty{margin:80px auto;text-align:center;color:#8b95a3}.hidden{display:none!important}@media(max-width:700px){.sidebar{width:210px;min-width:180px}.header{padding:0 15px}.composer{width:calc(100% - 24px)}}
</style>
</head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><span class="mark">L</span>loopminder <span class="muted" style="font-size:11px;font-weight:500">WORKSPACE</span></div><button class="new" id="newProject">＋ 新建项目</button><div class="sidehead"><span>项目</span><button class="link" id="refresh" style="width:auto;padding:2px">↻</button></div><div class="list" id="projects"></div><div class="sidefoot"><button class="link" id="settingsButton">⚙ &nbsp;设置</button></div></aside>
<main class="main"><header class="header"><span id="title" class="headline">项目工作台</span><nav class="tabs"><button class="tab active" data-tab="chat">对话</button><button class="tab" data-tab="activity">协作与轨迹</button></nav></header><div id="banner" class="banner" hidden></div><div class="body"><section class="view" id="activityView" hidden><div id="reconcilePanel" class="hidden" style="padding:12px 24px;border-bottom:1px solid #e5e7eb"><label>任务编号 <input id="reconcileTask" placeholder="输入任务编号"></label> <button class="secondary" id="reconcileButton">核对待确认派工</button> <button class="secondary" id="usageButton">查看负责人上下文</button><div id="reconcileResult" class="notice"></div><div id="usageResult" class="notice"></div></div><div class="empty" id="traceEmpty">选择项目后查看运行轨迹。</div><iframe id="traceFrame" title="项目运行轨迹" class="hidden" style="width:100%;height:calc(100% - 80px);border:0"></iframe></section><section id="chatView" class="body"><div class="welcome" id="welcome"><h1>从目标开始，协作向前</h1><div class="muted">选择一个项目，与 PM 讨论需求与下一步。</div></div><div class="messages hidden" id="messages"></div><div class="composer"><textarea id="message" placeholder="描述你的目标，或提出想讨论的问题" disabled></textarea><div class="bar"><span class="notice" id="projectLabel">先创建或选择项目</span><div><select id="model" aria-label="模型"><option value="">默认模型</option></select><select id="effort" aria-label="思考等级"><option value="">默认思考等级</option></select><button class="send" id="send" disabled aria-label="发送">↑</button></div></div></div></section></div></main></div>
<div class="overlay" id="projectDialog" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="projectHeading"><h2 id="projectHeading">新建项目</h2><label class="field">项目文件夹<div class="row"><input id="directory" placeholder="输入绝对路径或选择文件夹"><button id="chooseFolder">选择</button></div></label><label class="field">项目目标<input id="goal" placeholder="例如：帮助团队管理项目进度"></label><div class="notice">项目绑定到所选目录；不同项目的状态和会话分别保存。目录不能与其他项目、宿主或应用数据重叠。开发与审查前会检查整个目录；链接、硬链接或重解析点可能阻止操作，大目录检查可能耗时。</div><div id="projectError" class="error"></div><div class="actions"><button class="secondary" data-close="projectDialog">取消</button><button class="primary" id="createProject">创建项目</button></div></div></div>
<div class="overlay" id="settingsDialog" hidden><div class="dialog settings" role="dialog" aria-modal="true" aria-labelledby="settingsHeading"><h2 id="settingsHeading">模型设置</h2><label class="field">服务编号<input id="providerId" placeholder="例如 easycli"></label><label class="field">API 地址<input id="baseUrl" placeholder="http://127.0.0.1:8317/v1"></label><label class="field">API 凭据<input id="token" type="password" autocomplete="off" placeholder="留空则保留已有凭据"></label><div class="notice">凭据保存在本机 Windows 凭据管理器。远程地址使用 HTTPS。</div><div class="actions"><button class="secondary" id="saveProvider">保存服务</button><button class="secondary" id="discover">获取模型</button></div><div id="modelList"></div><div class="notice">每个模型可填写逗号分隔的思考等级；留空表示未知。</div><label class="field">默认模型<select id="defaultModel"><option value="">请选择</option></select></label><label class="field">默认思考等级<select id="defaultEffort"><option value="">默认</option></select></label><button class="secondary" id="saveDefault">保存默认模型</button><h2>Clef 设置</h2><label class="field">Cloudflare Account ID<input id="clefAccount"></label><label class="field">API 令牌<input id="clefToken" type="password" autocomplete="off" placeholder="留空则保留已有凭据"></label><button class="secondary" id="saveClef">保存 Clef 设置</button><div id="settingsError" class="error"></div><div class="actions"><button class="secondary" data-close="settingsDialog">关闭</button><button class="primary" id="saveModels">保存模型选择</button></div></div></div>
<script>
const $=s=>document.querySelector(s), state={projects:[],providers:[],project:null,busy:false,loadingView:false,discovered:[],ephemeral:false,localDev:false,viewVersion:0};
function showError(text){const e=$('#banner'),notice=state.ephemeral?'当前项目状态和模型设置存储在临时内存中，服务重启后会丢失。':'',dev=state.localDev?'当前为开发服务，会话和 Run 在异常退出后的恢复不受保证。':'';e.textContent=[notice,dev,text].filter(Boolean).join(' ');e.hidden=!e.textContent}function msg(role,text){const e=document.createElement('div');e.className='message '+role;e.textContent=text;$('#messages').append(e);$('#messages').scrollTop=$('#messages').scrollHeight;return e}
async function api(path,body){const r=await fetch('/workbench/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const v=await r.json();if(!r.ok){const e=new Error(v.error||'请求失败');e.project_id=v.project_id;e.status=r.status;throw e}return v}
function paintProjects(){const box=$('#projects');box.replaceChildren();state.projects.forEach(p=>{const b=document.createElement('button');b.className='project'+(state.project?.project_id===p.project_id?' active':'');b.title=p.directory||'需要绑定文件夹';b.textContent='▱  '+p.goal;b.onclick=()=>openProject(p);box.append(b)})}
async function loadProjects(){state.projects=await api('projects');paintProjects()}
function paintModels(){const previous=$('#model').value;$('#model').replaceChildren(new Option('工作台默认模型',''),new Option('现有 EasyCLI 配置','__legacy__'));state.providers.forEach(p=>(p.models||[]).filter(m=>m.enabled).forEach(m=>$('#model').add(new Option(p.name+' · '+m.id,JSON.stringify({provider:p.provider_id,model:m.id})))));if(previous&&![...$('#model').options].some(o=>o.value===previous))$('#model').add(new Option('会话已选模型（不可用或未加载）',previous));if([...$('#model').options].some(o=>o.value===previous))$('#model').value=previous;paintEffort(true)}
function paintEffort(keepUnknown=false){const s=$('#model').value,previous=$('#effort').value;$('#effort').replaceChildren(new Option('默认思考等级',''));if(s&&s!=='__legacy__'){const v=JSON.parse(s),p=state.providers.find(x=>x.provider_id===v.provider),m=p?.models?.find(x=>x.id===v.model);(m?.reasoning_levels||[]).forEach(e=>$('#effort').add(new Option(e,e)));if(keepUnknown&&previous&&![...$('#effort').options].some(o=>o.value===previous))$('#effort').add(new Option(previous+'（不可用或未加载）',previous))}if([...$('#effort').options].some(o=>o.value===previous))$('#effort').value=previous}
async function loadProviders(){state.providers=await api('providers');paintModels()}
async function openProject(p){const view=++state.viewVersion;let loaded=false;state.project=p;state.loadingView=true;paintProjects();$('#traceFrame').src='/workbench/trajectory?project_id='+encodeURIComponent(p.project_id);$('#traceFrame').classList.remove('hidden');$('#traceEmpty').classList.add('hidden');$('#title').textContent=p.goal;$('#projectLabel').textContent=p.directory||'项目未绑定文件夹（点击绑定）';$('#message').disabled=false;$('#send').disabled=true;$('#model').disabled=true;$('#effort').disabled=true;$('#model').value='';paintEffort();$('#welcome').classList.add('hidden');$('#messages').classList.remove('hidden');$('#messages').replaceChildren();showError('项目管理已启用；商讨和开发需要可验证的负责人环境与门禁。');try{const h=await api('history?project_id='+encodeURIComponent(p.project_id));if(state.viewVersion!==view)return;if(h.memory_model_error)showError('后台记忆暂不可用：'+h.memory_model_error);const selection=h.model_selection;if(h.model_legacy)$('#model').value='__legacy__';else if(selection){const value=JSON.stringify({provider:selection.provider_id,model:selection.model_id});if(![...$('#model').options].some(o=>o.value===value))$('#model').add(new Option('会话已选模型（不可用或未加载）',value));$('#model').value=value}else $('#model').value='';paintEffort();if(selection?.reasoning_effort){if(![...$('#effort').options].some(o=>o.value===selection.reasoning_effort))$('#effort').add(new Option(selection.reasoning_effort+'（不可用或未加载）',selection.reasoning_effort));$('#effort').value=selection.reasoning_effort}for(const m of h.messages||[]){if((m.type==='human'||m.type==='ai')&&typeof m.content==='string'&&m.content)msg(m.type==='human'?'user':'assistant',m.content)}loaded=true}catch(e){if(state.viewVersion===view)showError(e.message+'；请重新打开项目。')}finally{if(state.viewVersion===view){state.loadingView=!loaded;$('#model').disabled=!loaded;$('#effort').disabled=!loaded;$('#send').disabled=state.busy||state.loadingView||!state.project}}}
$('#newProject').onclick=()=>{$('#projectError').textContent='';$('#projectDialog').hidden=false};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).hidden=true);$('#refresh').onclick=()=>loadProjects().catch(e=>showError(e.message));$('#chooseFolder').onclick=async()=>{try{const x=await api('select-folder',{});if(x.directory)$('#directory').value=x.directory}catch(e){$('#projectError').textContent=e.message}};
$('#createProject').onclick=async()=>{try{const p=await api('projects',{directory:$('#directory').value,goal:$('#goal').value});$('#projectDialog').hidden=true;await loadProjects();await openProject(p)}catch(e){if(e.project_id&&e.status===409&&confirm('该文件夹已关联项目。打开已有项目？')){await loadProjects();const p=state.projects.find(x=>x.project_id===e.project_id);if(p){$('#projectDialog').hidden=true;await openProject(p);return}}if(e.project_id&&e.status===503)await loadProjects();$('#projectError').textContent=e.message}};
$('#settingsButton').onclick=()=>{$('#settingsError').textContent='';$('#settingsDialog').hidden=false};$('#saveProvider').onclick=async()=>{try{await api('providers',{provider_id:$('#providerId').value,base_url:$('#baseUrl').value,token:$('#token').value||undefined});$('#token').value='';await loadProviders();$('#settingsError').textContent='已保存'}catch(e){$('#settingsError').textContent=e.message}};
$('#discover').onclick=async()=>{try{const p=$('#providerId').value;state.discovered=(await api('providers/discover',{provider_id:p})).models;const previous=state.providers.find(x=>x.provider_id===p)?.models||[];const box=$('#modelList');box.replaceChildren();state.discovered.forEach(id=>{const row=document.createElement('label');row.className='field';const check=document.createElement('input');check.type='checkbox';check.style.display='inline';check.style.width='auto';check.dataset.model=id;check.checked=!!previous.find(x=>x.id===id&&x.enabled);row.append(check,document.createTextNode(' '+id));box.append(row)});$('#settingsError').textContent='请选择启用的模型'}catch(e){$('#settingsError').textContent=e.message}};
$('#saveModels').onclick=async()=>{try{const id=$('#providerId').value,p=state.providers.find(x=>x.provider_id===id);if(!p)throw Error('请先保存模型服务');const checked=[...$('#modelList input')];if(!checked.length)throw Error('请先获取模型');const models=checked.map(c=>({id:c.dataset.model,enabled:c.checked,reasoning_levels:p.models?.find(m=>m.id===c.dataset.model)?.reasoning_levels||null}));await api('providers',{provider_id:id,base_url:p.base_url,name:p.name,models});await loadProviders();$('#settingsDialog').hidden=true}catch(e){$('#settingsError').textContent=e.message}};
$('#model').onchange=()=>paintEffort();document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('#chatView').hidden=t.dataset.tab!=='chat';$('#activityView').hidden=t.dataset.tab!=='activity'});
async function send(){const input=$('#message'),text=input.value.trim();if(!text||!state.project||state.busy||state.loadingView)return;const project=state.project.project_id,view=state.viewVersion;state.busy=true;$('#send').disabled=true;input.value='';msg('user',text);let response=false;try{const body={project_id:project,message:text};if($('#model').value==='__legacy__')body.model_use_legacy=true;else if($('#model').value){const s=JSON.parse($('#model').value);body.model_provider=s.provider;body.model_name=s.model;if($('#effort').value)body.reasoning_effort=$('#effort').value}else body.model_use_default=true;const r=await fetch('/workbench/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const x=await r.json();throw Error(x.error||'请求失败')}const reader=r.body.getReader(),decoder=new TextDecoder();let pending='';while(true){const {value,done}=await reader.read();pending+=decoder.decode(value||new Uint8Array(),{stream:!done});const frames=pending.split('\n\n');pending=frames.pop();for(const frame of frames){if(!frame.startsWith('data: '))continue;const x=JSON.parse(frame.slice(6));if(x.event==='error')throw Error(x.data?.message||'模型请求失败');for(const node of Object.values(x.data||{})){if(node&&typeof node==='object'&&typeof node.pm_memory_model_error==='string'&&state.viewVersion===view)showError('后台记忆暂不可用：'+node.pm_memory_model_error)}for(const m of x.data?.model?.messages||[]){if(typeof m.content==='string'&&m.content){response=true;if(state.viewVersion===view)msg('assistant',m.content)}}}if(done)break}if(!response&&state.viewVersion===view)showError('本轮没有可显示的回复，请查看运行状态。')}catch(e){if(state.viewVersion===view)showError(e.message)}finally{state.busy=false;$('#send').disabled=!state.project||state.loadingView;if(state.project?.project_id===project&&state.viewVersion!==view)showError('上一轮已结束；重新打开项目可查看最新结果。')}}
$('#send').onclick=send;$('#message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};Promise.all([loadProjects(),loadProviders(),api('workspace-settings').then(x=>{state.ephemeral=x.store_durability==='ephemeral';state.localDev=x.checkpoint_runtime==='local_dev';if(state.ephemeral||state.localDev)showError('')})]).catch(e=>showError(e.message));
// Settings only display provider metadata; credentials are never fetched back.
function defaultEfforts(){const selected=$('#defaultModel').value;const old=$('#defaultEffort').value;$('#defaultEffort').replaceChildren(new Option('默认',''));if(selected){const s=JSON.parse(selected),p=state.providers.find(x=>x.provider_id===s.provider),m=p?.models?.find(x=>x.id===s.model);(m?.reasoning_levels||[]).forEach(x=>$('#defaultEffort').add(new Option(x,x)))}if([...$('#defaultEffort').options].some(x=>x.value===old))$('#defaultEffort').value=old}
async function refreshDefaults(){const current=await api('default-model');const select=$('#defaultModel');select.replaceChildren(new Option('请选择',''));state.providers.forEach(p=>(p.models||[]).filter(m=>m.enabled).forEach(m=>select.add(new Option(p.name+' · '+m.id,JSON.stringify({provider:p.provider_id,model:m.id})))));if(current)select.value=JSON.stringify({provider:current.provider_id,model:current.model_id});defaultEfforts();if(current?.reasoning_effort)$('#defaultEffort').value=current.reasoning_effort}
$('#defaultModel').onchange=defaultEfforts;
$('#settingsButton').onclick=async()=>{$('#settingsError').textContent='';$('#settingsDialog').hidden=false;try{await refreshDefaults();const c=await api('clef');$('#clefAccount').value=c.account_id||''}catch(e){$('#settingsError').textContent=e.message}};
$('#saveDefault').onclick=async()=>{try{if(!$('#defaultModel').value)throw Error('请选择默认模型');const s=JSON.parse($('#defaultModel').value);await api('default-model',{provider_id:s.provider,model_id:s.model,reasoning_effort:$('#defaultEffort').value||null});$('#settingsError').textContent='默认模型已保存'}catch(e){$('#settingsError').textContent=e.message}};
$('#saveClef').onclick=async()=>{try{await api('clef',{account_id:$('#clefAccount').value,token:$('#clefToken').value||undefined});$('#clefToken').value='';$('#settingsError').textContent='Clef 设置已保存'}catch(e){$('#settingsError').textContent=e.message}};
$('#discover').onclick=async()=>{try{const p=$('#providerId').value;state.discovered=(await api('providers/discover',{provider_id:p})).models;const previous=state.providers.find(x=>x.provider_id===p)?.models||[];const box=$('#modelList');box.replaceChildren();state.discovered.forEach(id=>{const row=document.createElement('div'),label=document.createElement('label'),check=document.createElement('input'),levels=document.createElement('input'),old=previous.find(x=>x.id===id);row.className='field';check.type='checkbox';check.dataset.model=id;check.checked=!!old?.enabled;levels.placeholder='思考等级，例如 low, medium, high';levels.value=(old?.reasoning_levels||[]).join(', ');levels.dataset.levels=id;label.append(check,document.createTextNode(' '+id));row.append(label,levels);box.append(row)});$('#settingsError').textContent='请选择启用的模型'}catch(e){$('#settingsError').textContent=e.message}};
$('#saveModels').onclick=async()=>{try{const id=$('#providerId').value,p=state.providers.find(x=>x.provider_id===id);if(!p)throw Error('请先保存模型服务');const checked=[...$('#modelList input[type=checkbox]')];if(!checked.length)throw Error('请先获取模型');const models=checked.map(c=>{const levels=[...$('#modelList input[data-levels]')].find(x=>x.dataset.levels===c.dataset.model).value.split(',').map(x=>x.trim()).filter(Boolean);return {id:c.dataset.model,enabled:c.checked,reasoning_levels:levels.length?levels:null}});await api('providers',{provider_id:id,base_url:p.base_url,name:p.name,models});await loadProviders();await refreshDefaults();$('#settingsError').textContent='模型选择已保存'}catch(e){$('#settingsError').textContent=e.message}};
$('#projectLabel').onclick=async()=>{if(!state.project||state.project.directory)return;const project=state.project.project_id,view=state.viewVersion;try{const selected=await api('select-folder',{});if(!selected.directory||state.viewVersion!==view)return;await api('projects/bind',{project_id:project,directory:selected.directory});await loadProjects();if(state.viewVersion!==view)return;const updated=state.projects.find(p=>p.project_id===project);if(updated)await openProject(updated)}catch(e){if(state.viewVersion===view)showError(e.message)}};

let reconciled=null;const candidateAgent=document.createElement('input');candidateAgent.placeholder='候选负责人会话 ID（首次创建中断时填写）';candidateAgent.setAttribute('aria-label','候选负责人会话 ID');$('#reconcileButton').before(candidateAgent);const attachButton=document.createElement('button');attachButton.className='secondary hidden';attachButton.textContent='关联已找到的 Run';$('#reconcilePanel').append(attachButton);

const memoryRollback=document.createElement('button');memoryRollback.className='secondary';memoryRollback.textContent='撤销未完成的记忆写回';$('#reconcilePanel').append(memoryRollback);memoryRollback.onclick=async()=>{const project=state.project?.project_id,view=state.viewVersion;if(!project)return;if(!memoryJournal||memoryJournal.project!==project){memoryStatus.textContent='请先核对当前项目的记忆写回记录。';return}try{const data=await api('memory-recovery?project_id='+encodeURIComponent(project)+'&action=rollback',{journal_digest:memoryJournal.digest});if(state.viewVersion===view){memoryStatus.textContent=data.status==='cancelled'?'已取消。':data.status==='rolled_back'?'已恢复到写回前状态；可重新提交记忆任务。':'当前没有待处理的写回。';if(data.status!=='cancelled')memoryJournal=null}}catch(e){if(state.viewVersion===view)memoryStatus.textContent=e.message}};
</script></body></html>
