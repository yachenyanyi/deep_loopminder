name: AI Branch CI

on:
  push:
    branches: [AI]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff incremental debt
        id: ruff
        continue-on-error: true
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          before="$BEFORE_SHA"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="HEAD^"
          fi
          git cat-file -e "${before}^{commit}"
          python -m ruff check --output-format json . > /tmp/ruff-after.json || true
          git checkout --detach "$before"
          python -m ruff check --output-format json . > /tmp/ruff-before.json || true
          git checkout --detach "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          def key(item):
              location = item.get("location") or {}
              end_location = item.get("end_location") or {}
              return (
                  item.get("filename"),
                  item.get("code"),
                  item.get("message"),
                  location.get("row"),
                  location.get("column"),
                  end_location.get("row"),
                  end_location.get("column"),
              )

          before = {key(item) for item in json.loads(Path("/tmp/ruff-before.json").read_text())}
          after_items = json.loads(Path("/tmp/ruff-after.json").read_text())
          introduced = [item for item in after_items if key(item) not in before]
          if introduced:
              print("New Ruff diagnostics introduced by this push:")
              for item in introduced:
                  loc = item.get("location") or {}
                  print(f"{item['filename']}:{loc.get('row')}:{loc.get('column')} {item.get('code')} {item.get('message')}")
              raise SystemExit(1)
          print("No new Ruff diagnostics introduced by this push.")
          PY
      - name: Compile Python
        id: compile
        continue-on-error: true
        run: python -m compileall -q src tests
      - name: Architecture guard
        id: architecture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          echo "::group::Repository architecture guard"

          if [ -d tools ]; then
            echo "::error::Top-level tools/ is forbidden; tools must belong to their middleware."
            fail=1
          fi

          # Official Interface First: these are intentionally conservative
          # path-level guards. Semantic duplication is reviewed separately.
          forbidden_paths_regex='(^|/)(event_store|trace_store|run_store|thread_store|checkpoint_store)(/|\.|$)'
          if git ls-files | grep -Ei "$forbidden_paths_regex"; then
            echo "::error::Potential shadow runtime/persistence store detected. Use official LangGraph/LangChain interfaces unless an Issue documents a reproducible API gap."
            fail=1
          fi

          # Do not commit runtime debris or secrets.
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.pem$|.*\.key$|id_rsa$|id_ed25519$)'; then
            echo "::error::Potential secret/private-key file is tracked."
            fail=1
          fi

          echo "::endgroup::"
          exit "$fail"
      - name: Aggregate static checks
        if: always()
        shell: bash
        env:
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          ARCHITECTURE_OUTCOME: ${{ steps.architecture.outcome }}
        run: |
          printf 'Ruff: %s\nCompile: %s\nArchitecture: %s\n' \
            "$RUFF_OUTCOME" "$COMPILE_OUTCOME" "$ARCHITECTURE_OUTCOME"
          [[ "$RUFF_OUTCOME" == success && \
             "$COMPILE_OUTCOME" == success && \
             "$ARCHITECTURE_OUTCOME" == success ]]

  package:
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pyproject
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          assert data["project"]["requires-python"]
          assert data["project"]["dependencies"]
          print("pyproject.toml: OK")
          PY
